<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d5c3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7a54;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d97a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Moon -->
  <path d="M 340 130 Q 300 180 300 220 Q 300 260 340 310 Q 280 300 250 250 Q 220 200 250 150 Q 280 100 340 130 Z"
        fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Book / Quran -->
  <rect x="140" y="230" width="230" height="170" rx="15" fill="#f5f5f5" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Book spine -->
  <line x1="255" y1="230" x2="255" y2="400" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Pages on right -->
  <line x1="275" y1="260" x2="350" y2="260" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="275" y1="285" x2="350" y2="285" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="275" y1="310" x2="350" y2="310" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="275" y1="335" x2="350" y2="335" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Pages on left (Arabic-like lines) -->
  <line x1="160" y1="260" x2="240" y2="260" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="160" y1="285" x2="240" y2="285" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="160" y1="310" x2="240" y2="310" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="160" y1="335" x2="240" y2="335" stroke="#0d5c3f" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Star -->
  <path d="M 380 90 L 388 115 L 415 115 L 393 132 L 401 158 L 380 142 L 359 158 L 367 132 L 345 115 L 372 115 Z"
        fill="url(#goldGrad)" opacity="0.9"/>
</svg>